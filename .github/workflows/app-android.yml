# Compila la app MIRS Móvil, la prueba en un emulador de Android conectada al servidor de MIRS
# y guarda el APK y las capturas de pantalla.
name: App Android (APK y capturas)

on:
  push:
    branches: [main]
    paths: ["android/**", "src/**", ".github/workflows/app-android.yml"]
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MIRS_Movil-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Iniciar el servidor de MIRS (lo que la app consulta)
        run: |
          pip install psutil pyserial
          PYTHONPATH=src nohup python -m mirs.servidor --sin-bluetooth > servidor.log 2>&1 &
          sleep 8 && curl -s http://127.0.0.1:8765/api/estado | head -c 300; echo

      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Ejecutar la app en el emulador y tomar capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/capturas.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-app
          path: capturas
